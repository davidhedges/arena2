name: PvP Match Validation

on:
  pull_request:
    paths:
      - ".github/workflows/pvp-match-validation.yml"
      - "match-server/**"
      - "hub-server/**"
      - "match_provisioner/**"
      - "server/**"
      - "ops/build-match-spacetimedb.sh"
      - "ops/check-match-wasm-size.sh"
      - "ops/run-local-match-provisioner.sh"
      - "ops/setup-local-multiplayer.sh"
      - "ops/test-setup-local-multiplayer.sh"
      - "docs/match-start-latency-optimization-plan-2026-08-11.md"
  workflow_dispatch:

jobs:
  match-module:
    name: Optimized Match Module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install Binaryen
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install SpacetimeDB CLI
        run: |
          set -euo pipefail
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          wasm-opt --version
          spacetime --version

      - name: Test PvP lifecycle slices
        run: |
          set -euo pipefail
          cargo test --manifest-path match-server/Cargo.toml bot_matches::tests
          cargo test --manifest-path match-server/Cargo.toml match_contract::tests
          cargo test --manifest-path match-server/Cargo.toml arena_map_01_layout_is_flat_and_has_no_invisible_example_obstacles

      - name: Test Hub and provisioner control plane
        run: |
          set -euo pipefail
          cargo test --manifest-path hub-server/Cargo.toml
          python3 -m unittest match_provisioner.test_worker
          ops/test-setup-local-multiplayer.sh

      - name: Build optimized module and generate bindings
        env:
          MATCH_GENERATED_OUT: ${{ runner.temp }}/ArenaMatchBindings
        run: ops/build-match-spacetimedb.sh

      - name: Prove oversized artifacts are rejected
        run: |
          set -euo pipefail
          if MATCH_WASM_MAX_BYTES=1 ops/check-match-wasm-size.sh match-server/target/wasm32-unknown-unknown/release/arena_match.opt.wasm; then
            echo "The size guard unexpectedly accepted an oversized artifact." >&2
            exit 1
          fi
