<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena — Level Up Reward (UI spec)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="reward-choice.css">
<style>
/* ============ SCAFFOLD — browser-only, never translated ============
 * The stage renders at the game's 1920x1080 reference resolution and scales
 * to fit the browser. reward-choice.css remains the USS-translatable spec. */

@font-face {
  font-family: "Cinzel";
  font-weight: 400 900;
  src: url("../../../Assets/Arena/Content/UI/Fonts/Cinzel.ttf") format("truetype");
}
@font-face {
  font-family: "Alegreya";
  font-weight: 400 900;
  src: url("../../../Assets/Arena/Content/UI/Fonts/Alegreya.ttf") format("truetype");
}

* { box-sizing: border-box; margin: 0; padding: 0; }
button { outline: none; }

html, body {
  height: 100%;
  background: #050608;
  color: #e7e1d3;
  font-family: "Alegreya", Georgia, serif;
  overflow: hidden;
}

.sc-shell { height: 100%; display: flex; flex-direction: column; }
.sc-stagewrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.sc-stage {
  position: relative;
  width: 1920px;
  height: 1080px;
  flex: none;
  transform-origin: center center;
  outline: 1px solid rgba(255, 255, 255, 0.07);
}
.sc-backdrop { position: absolute; inset: 0; }
.orbit-lines { position: absolute; inset: 0; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .level-up-layout,
  .path-option,
  .stat-step,
  .confirm-button,
  .dice-overlay {
    transition-duration: 0s !important;
  }
}
</style>
</head>
<body>
<div class="sc-shell">
  <div class="sc-stagewrap">
    <div class="sc-stage" id="Stage">
      <canvas class="sc-backdrop" id="Backdrop" width="1920" height="1080"></canvas>

      <!-- ================= SPEC MARKUP =================
           ids are the binding contract for the future UXML/controller. -->
      <main class="level-up" id="LevelUp">
        <div class="menu-veil"></div>

        <div class="stage-frame" aria-hidden="true">
          <div class="stage-rail stage-rail--top"></div>
          <div class="stage-rail stage-rail--bottom"></div>
          <div class="stage-rail stage-rail--left"></div>
          <div class="stage-rail stage-rail--right"></div>
          <div class="stage-corner stage-corner--tl"></div>
          <div class="stage-corner stage-corner--tr"></div>
          <div class="stage-corner stage-corner--bl"></div>
          <div class="stage-corner stage-corner--br"></div>
        </div>

        <div class="level-up-layout" id="LevelUpLayout">
          <header class="level-up-heading">
            <div class="title-flourish title-flourish--left">✦</div>
            <div class="heading-copy">
              <h1 class="level-up-title">LEVEL UP</h1>
              <div class="title-rule"></div>
              <h2 class="level-up-kicker">CHOOSE YOUR PATH</h2>
              <p class="level-up-instruction" id="Instruction" role="status" aria-live="polite">
                Allocate your points and choose one path to gain new powers.
              </p>
            </div>
            <div class="title-flourish title-flourish--right">✦</div>
          </header>

          <div class="level-up-content">
            <section class="ability-panel" aria-labelledby="AbilityHeading">
              <div class="points-remaining" id="PointsRemaining">5</div>
              <h2 class="ability-heading" id="AbilityHeading">ABILITY POINTS</h2>
              <div class="ability-subheading">REMAINING</div>
              <div class="panel-rule"></div>
              <div class="stat-list" id="StatList"></div>
              <button class="reset-button" id="ResetPoints" type="button">RESET POINTS</button>
            </section>

            <section class="path-panel path-panel--spell" id="SpellPanel"
                     aria-labelledby="SpellHeading">
              <h2 class="path-heading" id="SpellHeading">SPELLCASTING SCHOOL</h2>
              <div class="path-heading-rule"></div>
              <div class="constellation" id="SpellConstellation">
                <canvas class="orbit-lines" id="SpellLines" width="540" height="550"
                        aria-hidden="true"></canvas>
                <div class="constellation-core constellation-core--spell" aria-hidden="true">
                  <div class="core-art core-art--spell"></div>
                </div>
                <div class="option-orbit" id="SpellSchoolOptions"></div>
              </div>
              <div class="selection-copy" id="SpellSelection">Choose a spellcasting school</div>
            </section>

            <div class="or-medallion" aria-hidden="true"><span>OR</span></div>

            <section class="path-panel path-panel--discipline" id="DisciplinePanel"
                     aria-labelledby="DisciplineHeading">
              <h2 class="path-heading" id="DisciplineHeading">COMBAT DISCIPLINE</h2>
              <div class="path-heading-rule"></div>
              <div class="constellation" id="DisciplineConstellation">
                <canvas class="orbit-lines" id="DisciplineLines" width="540" height="550"
                        aria-hidden="true"></canvas>
                <div class="constellation-core constellation-core--discipline" aria-hidden="true">
                  <div class="core-art core-art--discipline"></div>
                </div>
                <div class="option-orbit" id="CombatDisciplineOptions"></div>
              </div>
              <div class="selection-copy" id="DisciplineSelection">Choose a combat discipline</div>
            </section>
          </div>

          <footer class="confirm-footer">
            <button class="confirm-button" id="ConfirmRoll" type="button" disabled>
              <span class="confirm-gem confirm-gem--left" aria-hidden="true"></span>
              <span class="confirm-label">CONFIRM &amp; ROLL</span>
              <span class="confirm-gem confirm-gem--right" aria-hidden="true"></span>
            </button>
          </footer>
        </div>

        <div class="dice-overlay" id="DiceOverlay" aria-hidden="true">
          <div class="dice-veil"></div>
          <canvas class="dice-viewport" id="DiceViewport" width="1920" height="1080"></canvas>
          <div class="dice-status" id="DiceStatus" role="status" aria-live="polite">
            <div class="dice-status-kicker">FATE IS TURNING</div>
            <div class="dice-result" id="DiceResult"></div>
            <div class="dice-hint" id="DiceHint">Click the die to skip to the result</div>
          </div>
        </div>
      </main>
      <!-- =============== END SPEC MARKUP =============== -->
    </div>
  </div>
</div>

<script src="reward-choice.js"></script>
</body>
</html>
